<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-Up Gamer | Mi Carrito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-container {
            display: flex;
            gap: 30px;
            padding: 40px 50px;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .cart-items {
            flex: 2;
            min-width: 300px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            background-color: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background-color: #FFFFFF;
            border-radius: 5px;
            margin-right: 20px;
            padding: 5px;
        }
        .item-details { flex: 1; }
        .item-price { color: #39FF14; font-weight: bold; font-size: 1.2rem; }
        .item-quantity { display: flex; align-items: center; gap: 10px; }
        .item-quantity button {
            background-color: #1E90FF; color: #FFF; border: none;
            padding: 5px 12px; cursor: pointer; border-radius: 3px; font-weight: bold; font-size: 1.2rem;
        }
        .cart-summary {
            flex: 1;
            min-width: 250px;
            background-color: #1a1a1a;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #333;
            height: fit-content;
        }
        .total-price { font-size: 2rem; color: #39FF14; margin: 20px 0; }
        .discount-code { display: flex; gap: 10px; margin-bottom: 20px; }
        .discount-code input {
            flex: 1; padding: 10px; border-radius: 4px;
            border: 1px solid #333; background-color: #000; color: #FFF;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>LEVEL-UP GAMER</h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html" class="btn-secondary">Iniciar sesión</a>
            <a href="registro.html" class="btn-secondary">Registrar usuario</a>
            <a href="carrito.html" class="cart-icon active" id="cart-counter">🛒 Cart (0)</a>
        </div>
    </header>

    <main>
        <div class="cart-container">
            <div class="cart-items">
                <h2 style="margin-bottom: 20px;">Mi carrito de compras</h2>
                <div id="contenedor-items-carrito">
                </div>
            </div>

            <div class="cart-summary">
                <h3>Resumen de compra</h3>
                <div>TOTAL: <div class="total-price" id="precio-total">$0 CLP</div></div>
                
                <div class="discount-code">
                    <input type="text" placeholder="Ingresa tu cupón" id="input-cupon">
                    <button class="btn-secondary" style="border: 1px solid #fff; padding: 5px 10px; border-radius: 4px;" id="btn-aplicar-cupon">APLICAR</button>
                </div>
                
                <button class="btn-primary" style="width: 100%; font-size: 1.2rem; padding: 15px;" id="btn-pagar">PAGAR</button>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Level-Up Gamer. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="carrito.js"></script>
</body>
</html>
